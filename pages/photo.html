
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>极简 · 双图相框 · 竖直排列</title>
    <style>
        /* 全局重置 & 极简风格 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f2f4f8;  /* 柔和背景 */
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            /*padding: 2rem 1.5rem;*/
        }

        /* 主卡片 —— 干净的白底 + 柔和阴影，容纳两张相框 */
        .frame-card {
            max-width: 100%;
            width: 100%;
            background: #ffffff;
            /*border-radius: 2.2rem;*/
            box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.1), 0 8px 24px -6px rgba(0, 0, 0, 0.05);
            padding: 1rem 1rem 1rem 1rem;
            transition: all 0.2s ease;
            text-align: center;
        }

        /* 竖直排列容器 —— 使用 flex 列，间距舒适 */
        .photo-stack {
            display: flex;
            flex-direction: column;
            gap: 1.8rem;          /* 两张图片之间的间距 */
            align-items: center;
        }

        /* 每个相框容器 —— 模拟 “相框的感觉” */
        .photo-frame {
            position: relative;
            background: #ffffff;
            padding: 0.7rem;              /* 内边距形成白边（相框） */
            /*border-radius: 1.5rem;*/        /* 圆润相框边角 */
            box-shadow: 
                inset 0 0 0 1px rgba(0, 0, 0, 0.04),   /* 极细内线，增加层次 */
                0 8px 20px -8px rgba(0, 0, 0, 0.12);    /* 轻微外阴影，让相框立体 */
            transition: box-shadow 0.2s;
            width: 100%;                  /* 相框宽度撑满卡片 */
        }

        /* 图片本身 —— 填满相框，圆角与相框呼应 */
        .photo-frame img {
            display: block;
            width: 100%;
            height: auto;
            /*aspect-ratio: 1 / 1;*/           /* 1:1 方形图片，更显精致 */
            object-fit: cover;             /* 保证图片填充均匀 */
            /*border-radius: 1rem; */          /* 内圆角，与相框外圆角形成层次 */
            background: #e9edf2;           /* 图片加载前占位色 */
        }

        /* 每张图片下方的文字描述（只针对单张描述） */
        .frame-caption {
            margin-top: 0.9rem;
            padding: 0 0.2rem;
            text-align: center;
        }

        .frame-caption p {
            font-size: 1rem;
            line-height: 1.5;
            color: #1e293b;
            letter-spacing: 0.01em;
            font-weight: 400;
        }

        .frame-caption .sub {
            font-size: 0.85rem;
            color: #64748b;
            letter-spacing: 0.02em;
            font-weight: 350;
        }

        /* 装饰分隔线 (可用于单张描述内) */
        .desc-divider {
            width: 2rem;
            height: 2px;
            background: #dce1e9;
            margin: 0.3rem auto 0.5rem auto;
            border-radius: 4px;
        }

        /* 整体卡片底部可能留白，但由 photo-stack gap 控制，不额外添加 */

        /* 移动端优化 */
        @media (max-width: 480px) {
            .frame-card {
                padding: 1.25rem 1.25rem 1.5rem 1.25rem;
            }
            .photo-frame {
                padding: 0.5rem;
                /*border-radius: 1.2rem;*/
            }
            .photo-frame img {
                border-radius: 0rem;
            }
            .photo-stack {
                gap: 1.5rem;
            }
            .frame-caption p {
                font-size: 0.95rem;
            }
        }

        /* 悬停相框微浮效果 (可选) */
        .photo-frame:hover {
            box-shadow: 
                inset 0 0 0 1px rgba(0, 0, 0, 0.02),
                0 12px 28px -10px rgba(0, 0, 0, 0.18);
        }

        /* 整体卡片悬停不必再单独处理，因为相框本身已有 hover */
    </style>
</head>
<body>

    <div class="frame-card">
        <!-- 竖直排列的两张图片 (相框风格) -->
        <div class="photo-stack">

            <div class="photo-frame">
                <img 
                    src="/images/scenery/birds_in_the_blue_sky.jpg" 
                    loading="lazy"
                />
                <div class="frame-caption">
                    <p>大雁南飞</p>
                    <div class="desc-divider"></div>
                    <p class="sub">河北 · 张家口 · 怀来大桥  |  2026.04</p>
                </div>
            </div>

            <div class="photo-frame">
                <img 
                    src="/images/scenery/sunset_huailai_couple.jpg" 
                    loading="lazy"
                />
                <div class="frame-caption">
                    <p>爱在日落黄昏时</p>
                    <div class="desc-divider"></div>
                    <p class="sub">河北 · 张家口 · 怀来大桥北侧  |  2026.04</p>
                </div>
            </div>

            <div class="photo-frame">
                <img 
                    src="/images/scenery/sea_curious_kid.jpg" 
                    loading="lazy"
                />
                <div class="frame-caption">
                    <p>望向海的那一边</p>
                    <div class="desc-divider"></div>
                    <p class="sub">山东 · 日照 · 灯塔  |  2023.10</p>
                </div>
            </div>

            <div class="photo-frame">
                <img 
                    src="/images/scenery/sunset_playground.jpg" 
                    loading="lazy"
                />
                <div class="frame-caption">
                    <p>落日下的校园</p>
                    <div class="desc-divider"></div>
                    <p class="sub">重庆 · 重庆大学B区  |  2023.05</p>
                </div>
            </div>

            
        </div>
        
    </div>

</body>
</html>
